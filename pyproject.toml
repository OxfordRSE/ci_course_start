[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ci_course"
version = "0.1.0"
description = "Demonstration of setting up continuous integration for a Python project"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
dev = [
    "interrogate",
    "pytest",
    "pytest-cov",
    "ruff",
]
docs = [
    "sphinx",
]

[project.scripts]
ci-course = "ci_course.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["ci_course"]

[tool.interrogate]
fail-under = 100
exclude = [".cheat", "build", "docs", "tests", "venv"]
verbose = 2
